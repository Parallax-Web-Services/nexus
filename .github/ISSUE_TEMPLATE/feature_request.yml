name: Feature proposal
description: Discuss a change to the shared NEXUS core.
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: "Please explain scope and compatibility; NEXUS supports applications outside Parallax."
  - type: textarea
    id: use-case
    attributes:
      label: Use case
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Authentication, authorization, data, and migration impact
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and related projects
